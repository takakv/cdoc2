[package]
name = "cdoc2"
version = "0.0.0"
description = "CDOC2 encrypted document containers"
readme = "../README.md"
keywords = ["cdoc2", "cdoc", "encryption", "eid", "estonia"]
categories = ["cryptography"]
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
block-buffer = "0.12.1"
chacha20 = { version = "0.10.2", default-features = false, features = ["cipher", "zeroize"] }
derive_more = { version = "2.1.1", default-features = false, features = ["debug"] }
elliptic-curve = { version = "0.14.1", default-features = false, features = ["ecdh", "getrandom", "sec1"] }
flatbuffers = "25.12.19"
flate2 = "1.1.10"
form_urlencoded = "1"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13"
p256 = { version = "0.14.0", default-features = false, features = ["ecdh"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdh"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdh"] }
pbkdf2 = "0.13.0"
poly1305 = { version = "0.9.1", features = ["zeroize"] }
sha1 = { version = "0.11.0", optional = true }
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
zeroize = { version = "1.8.1", default-features = false, features = ["alloc"] }
x509-cert = { version = "0.3.0", optional = true }

[features]
hazmat = []
x509 = ["dep:sha1", "dep:x509-cert", "p256/pkcs8", "p384/pkcs8", "p521/pkcs8"]

[dev-dependencies]
p384 = { version = "0.14.0", default-features = false, features = ["pem"] }
wycheproof = { version = "0.7.0", default-features = false, features = ["aead"] }
