[package]
name = "cdoc2"
version = "0.0.0"
description = "CDOC2 encrypted document containers"
readme = "../README.md"
keywords = ["cdoc2", "cdoc", "encryption", "eid", "estonia"]
categories = ["cryptography"]
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
