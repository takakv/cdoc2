[package]
name = "cdoc2"
version = "0.0.0"
edition = "2024"
description = "CDOC2 encrypted document containers"
license = "Apache-2.0"
homepage = "https://github.com/takakv/cdoc2"
repository = "https://github.com/takakv/cdoc2"
keywords = ["cdoc2", "cdoc", "encryption", "eid", "estonia"]
categories = ["cryptography"]

[dependencies]
chacha20poly1305 = "0.11.0"
flatbuffers = "25.12.19"
flate2 = "1.1.10"
hkdf = "0.13.0"
hmac = "0.13"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
