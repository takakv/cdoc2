[package]
name = "cdoc2-client"
version = "0.0.0"
description = "Key capsule server client for CDOC2 encrypted document containers"
keywords = ["cdoc2", "cdoc", "encryption", "eid", "estonia"]
categories = ["cryptography"]
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
cdoc2 = { path = "../cdoc2", version = "0.0.0" }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa-core"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa-core"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa-core"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tiny_http = "0.12.0"
